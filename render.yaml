services:
  # FastAPI Backend Service on Render
  - type: web
    name: tennis-intelligence-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: PYTHONPATH
        value: "backend:machine-learning/models:."
      - key: ENVIRONMENT
        value: "production"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://tennis-intelligence.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: DATABASE_URL
        sync: false
