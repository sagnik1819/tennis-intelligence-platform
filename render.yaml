services:
  # FastAPI Backend Service on Render (Multi-Worker + Redis L2 Ready)
  - type: web
    name: tennis-intelligence-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-2} --backlog 2048 --timeout-keep-alive 30 --no-access-log --app-dir backend"
    envVars:
      - key: PYTHONPATH
        value: "backend:machine-learning/models:."
      - key: ENVIRONMENT
        value: "production"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://tennis-intelligence.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
