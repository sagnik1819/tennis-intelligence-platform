services:
  # 1. FastAPI Backend Service on Render
  - type: web
    name: tennis-intelligence-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --app-dir backend"
    envVars:
      - key: PYTHONPATH
        value: "backend:machine-learning/models:."
      - key: ENVIRONMENT
        value: "production"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://tennis-intelligence-frontend.onrender.com,http://localhost:5173"
      - key: DATABASE_URL
        sync: false

  # 2. React Frontend Static Site on Render
  - type: web
    name: tennis-intelligence-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://tennis-intelligence-backend.onrender.com/api/v1"
