name: Tennis Intelligence Platform CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Module 1 Verification
      run: python module1-foundation/tennis_reader.py

    - name: Run Module 2 API Sync Verification
      run: python data-engineering/extraction/test_api_sync.py

    - name: Run Module 3 ETL Pipeline Verification
      run: python data-engineering/pipelines/test_etl_pipeline.py

    - name: Run Module 4 SQL 20-Query Verification
      run: python sql/test_queries.py

    - name: Run Module 5 & Endpoints Verification
      run: python backend/test_backend.py

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Install Frontend Dependencies & Build
      run: |
        cd frontend
        npm install
        npm run build
