version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: tip_postgres
    restart: always
    environment:
      POSTGRES_USER: tennis_admin
      POSTGRES_PASSWORD: TennisPassword@2026
      POSTGRES_DB: tennis_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis_admin -d tennis_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tip_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://tennis_admin:TennisPassword@2026@db:5432/tennis_intelligence
      JWT_SECRET_KEY: tennis-intelligence-super-secret-production-key-32-chars-long!
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # React Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tip_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
