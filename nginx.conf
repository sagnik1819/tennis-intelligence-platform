# Edge Micro-Cache for Public Analytics & Catalog API Responses
proxy_cache_path /var/cache/nginx/tip_api levels=1:2 keys_zone=tip_api_cache:32m max_size=256m inactive=10m use_temp_path=off;

upstream backend_pool {
    server backend:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name localhost;

    # Compression for HTML, JS, CSS & JSON payloads
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    # Immutable long-lived cache for fingerprinted Vite static bundles
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy & micro-cache API calls to multi-worker FastAPI pool
    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Origin-driven edge caching + stampede lock
        proxy_cache tip_api_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        add_header X-Edge-Cache $upstream_cache_status;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
